[build]
  publish = "dist"
  command = "npm run build"

# Custom Domain & HTTPS Redirects
[[redirects]]
  from = "http://safepark.app/*"
  to = "https://safepark.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/webhooks/stripe"
  to = "/api/webhooks/stripe"
  status = 200

[[redirects]]
  from = "/api/webhooks/hazards"
  to = "/api/webhooks/hazards"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Edge Security Headers & CSP
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.mapbox.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.mapbox.com https://*.stripe.com; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://data.sfgov.org https://api.stripe.com https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://safepark.app https://api.safepark.app; worker-src 'self' blob:; child-src 'self' blob: https://js.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), bluetooth=(self), notifications=(self)"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://safepark.app"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Signature, X-SafePark-Key"
