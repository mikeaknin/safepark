name: SafePark CI / CD & Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test_and_build:
    name: Automated Invariants, Anti-Bias & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Run Production TypeScript & Vite Build
        run: npm run build
