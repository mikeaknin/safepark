<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Minimalist Geometric P -->
  <path
    d="M 148 108
       L 276 108
       C 342 108, 396 162, 396 228
       C 396 294, 342 348, 276 348
       L 204 348
       L 204 404
       C 204 419, 192 432, 176 432
       C 160 432, 148 419, 148 404
       Z
       M 204 164
       L 204 292
       L 276 292
       C 311 292, 340 263, 340 228
       C 340 193, 311 164, 276 164
       Z"
    fill="url(#pGrad)"
    fill-rule="evenodd"
  />

  <!-- Emerald Beacon Dot Inside Counter of P -->
  <circle cx="272" cy="228" r="32" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)" stroke="#FFFFFF" stroke-width="6"/>
</svg>
